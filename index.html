<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e1251b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<title>ARGOPOWER Tool Blaster</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#nm{position:absolute;display:none;box-sizing:border-box;text-align:center;font:bold 16px Impact,'Arial Black',sans-serif;border:3px solid #f5b800;border-radius:8px;background:#17171b;color:#fff;outline:none;z-index:2;padding:0}</style>
</head><body><canvas id="c"></canvas><input id="nm" maxlength="12" placeholder="ENTER YOUR NAME" autocomplete="nickname" enterkeyhint="go"><script src="config.js"></script><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=640,R='#e1251b',Y='#f5b800',K='#17171b';
const nmEl=document.getElementById('nm');let sc=1,ox=0,oy=0,dpr=1;
function rs(){dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2;const q=nmEl.style;q.left=(ox+(W/2-100)*sc)+'px';q.top=(oy+380*sc)+'px';q.width=200*sc+'px';q.height=30*sc+'px';q.fontSize=16*sc+'px'}
addEventListener('resize',rs);rs();
let st='title',sex='m',hi=0,P,B=[],E=[],X=[],U=[],F=[],O=[],score=0,tm=0,spT=1,obT=6,mT=4,ov=0,pause=false,tx=W/2,ty=H-150,tch=false,keys={};
let bd=0,boss=null,warnT=0,stT=0,prevT=0,glDone=0,bannerT=0,flash=0,flashC='60,255,106',toolDone=false,bgS=0,bgPrev=0,bgFade=0;
try{hi=+localStorage.getItem('ap_hi')||0}catch(e){}
/* ===== CAMPAIGN CONFIG: the scoreboard link now lives in config.js (so updating this file never erases it) ===== */
const API_URL=(typeof window.API_URL==='string'?window.API_URL:'').trim();
let pname='',did='',subMsg='',lbRows=[],lbMsg='',nmT=0,nmMsg='';
try{pname=localStorage.getItem('ap_name')||'';did=localStorage.getItem('ap_did')||''}catch(e){}
if(!did){did=Math.random().toString(36).slice(2,12);try{localStorage.setItem('ap_did',did)}catch(e){}}
nmEl.value=pname;
const IM={};
['m','f','m_eye','m_glove','m_helm','f_eye','f_glove','f_helm','bee1','bee2','ant1','ant2','drone1','drone2','boss1','boss2','boss3','ob1a','ob1b','ob2a','ob2b','ob3a','ob3b','bg1','bg2','bg3','heat','nail','disc','glove','helm','eye','pdisc','sting','spit','dlaser','bolt'].forEach(k=>{const i=new Image();i.src='assets/'+k+(k.slice(0,2)=='bg'?'.jpg':'.png');IM[k]=i});
const ok=k=>IM[k]&&IM[k].complete&&IM[k].naturalWidth;
function spr(k,x,y,h,rot,mw){const i=IM[k];let w=h*i.naturalWidth/i.naturalHeight;if(mw&&w>mw){w=mw;h=w*i.naturalHeight/i.naturalWidth}g.save();g.translate(x,y);if(rot)g.rotate(rot);g.drawImage(i,-w/2,-h/2,w,h);g.restore()}
function go(){const v=nmEl.value.trim().replace(/[<>&"']/g,'').slice(0,12);
 if(v.length<2){nmMsg='Enter your name (at least 2 letters)';nmT=2.5;nmEl.focus();return}
 pname=v;try{localStorage.setItem('ap_name',v)}catch(e){}nmEl.blur();init()}
const lbGet=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
function localAdd(){const a=lbGet('ap_local');a.push({n:pname,s:score});a.sort((x,y)=>y.s-x.s);try{localStorage.setItem('ap_local',JSON.stringify(a.slice(0,10)))}catch(e){}}
function submit(){subMsg='';if(!API_URL){localAdd();subMsg='Saved on this device';return}
 subMsg='Submitting…';const body=JSON.stringify({name:pname,did,score,secs:Math.round(tm)});
 const send=n=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(r=>r.json()).then(j=>{subMsg=j.ok?'Submitted! Your rank: #'+j.rank:(j.err||'Could not submit')}).catch(()=>{if(n<2){subMsg='Retrying…';setTimeout(()=>send(n+1),3000)}else subMsg='Offline: score not sent'});send(0)}
function showLb(){st='lb';if(!API_URL){lbRows=lbGet('ap_local');lbMsg='Preview board (scoreboard not connected)';return}
 lbRows=lbGet('ap_lb');lbMsg='Loading…';
 fetch(API_URL+'?action=top&t='+Date.now()).then(r=>r.json()).then(j=>{if(j.ok){lbRows=j.rows;lbMsg='';try{localStorage.setItem('ap_lb',JSON.stringify(j.rows))}catch(e){}}else lbMsg='Try again later'}).catch(()=>{lbMsg='Offline: showing last saved board'})}

/* ===== GAME DATA ===== */
const TOOLS={heat:['HEAT GUN','🔥'],nail:['NAIL GUN','📌'],disc:['GRINDER','⚙️']},PPE={glove:'🧤',helm:'⛑️',eye:'🥽'};
const COL={eye:'58,168,255',glove:'60,255,106',helm:'255,210,31'},DUR={eye:5,glove:3,helm:7},CAP={eye:15,glove:9,helm:21};
const STG=[{n:'WESTERN FOREST'},{n:'THE DRYLANDS'},{n:'CONSTRUCTION SITE'}],BNAME=['MECHANICAL BEE','MECHA ANT QUEEN','BATTLE DRONE'];
const bAt=n=>n<3?[2000,4500,7500][n]:7500+3500*(n-2);   // boss score thresholds: 2000, 4500, 7500, then +3500 each
const stg=()=>bd%3,lp=()=>(bd/3)|0;
const dif=()=>Math.min(2.4,.55+.28*bd+Math.min(.3,stT/120*.3));   // starts very easy, steps up a little after every boss
const mkP=()=>({x:W/2,y:H-130,wp:'drill',cols:1,t:{eye:0,glove:0,helm:0},last:'',inv:0,li:3,cd:0,tilt:0,bx:[],beam:0});
function init(){P=mkP();P.inv=1.5;B=[];E=[];X=[];U=[];F=[];O=[];score=0;tm=0;spT=1.2;obT=7;mT=4;bd=0;boss=null;warnT=0;stT=0;prevT=0;glDone=0;toolDone=false;bannerT=3.2;flash=0;bgPrev=0;bgFade=0;tx=W/2;ty=H-150;pause=false;st='play'}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc]}
cv.addEventListener('pointerdown',e=>{const[x,y]=pt(e);tch=true;
 if(howInst){howInst=false;return}
 if(pause){pause=false;return}
 if(st=='title'){if(y>270&&y<370)sex=x<W/2?'m':'f';else if(y>=420&&y<=470&&x>90&&x<270)go();else if(y>=482&&y<=520&&x>90&&x<270)showLb();else if(y>=528&&y<=562&&x>90&&x<270&&!inst())install()}
 else if(st=='lb'){st='title'}
 else if(st=='over'){if(ov>1)showLb()}
 else{tx=x;ty=y-60}});
cv.addEventListener('pointermove',e=>{if(tch&&st=='play'){const[x,y]=pt(e);tx=x;ty=y-60}});
addEventListener('pointerup',()=>tch=false);
addEventListener('keydown',e=>{if(e.target===nmEl){if(e.key=='Enter')go();return}const k=e.key.toLowerCase();keys[k]=1;
 if(st=='title'&&(k=='enter'||k==' '))go();else if(st=='lb')st='title';else if(st=='over'&&k=='enter'&&ov>1)showLb();if(k=='p')pause=!pause});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pause=true});

/* ===== HELPERS ===== */
const ht=(e,x,y,r)=>Math.hypot(x-e.x,y-e.y)<e.r+r;
const bossHit=(x,y,r)=>{if(!boss||boss.y<-10)return false;const dx=(x-boss.x)/(boss.hw+r),dy=(y-boss.y)/(boss.hh+r);return dx*dx+dy*dy<1};
const obHit=(o,x,y,r)=>Math.abs(x-o.x)<o.hw*.9+r&&Math.abs(y-o.y)<o.hh*.85+r;
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,c})}}
function drop(x,y){let k;if(P.wp!='drill'&&Math.random()<.4)k=P.wp;else{const r=Math.random();k=r<.2?'heat':r<.4?'nail':r<.6?'disc':r<.8?'eye':'helm'}U.push({k,x,y})}
const MC={bee:Y,ant:'#b5532a',drone:'#7fd0ff'};
function kill(e,gain=true){if(e.dead)return;if(gain)score+=e.pts;boom(e.x,e.y,MC[e.k],9);e.dead=1;if(gain&&Math.random()<(bd==0?.17:.13))drop(e.x,e.y)}
function bhit(d){if(!boss)return;boss.hp-=d;boss.fl=.08;if(boss.hp<=0)bossDie()}
function hurt(){if(P.inv>0||P.t.eye>0||P.t.glove>0)return;
 P.li--;P.cols=Math.max(1,P.cols-1);boom(P.x,P.y,R,24);P.inv=2.2;
 if(P.li<=0){st='over';ov=0;submit();if(score>hi){hi=score;try{localStorage.setItem('ap_hi',hi)}catch(e){}}}}
function clearAll(){for(const e of E){boom(e.x,e.y,MC[e.k],7);e.dead=1}for(const o of O)boom(o.x,o.y,'#c9a36b',12);O=[];X=[];if(boss)bhit(boss.mx*.08);flash=.5;flashC=COL.glove}
function pick(u){score+=50;
 if(TOOLS[u.k]){if(P.wp==u.k)P.cols=Math.min(5,P.cols+1);else{P.wp=u.k;P.cols=1}}
 else{P.last=u.k;P.t[u.k]=Math.min(CAP[u.k],P.t[u.k]+DUR[u.k]);
  if(u.k=='glove'){P.li=Math.min(6,P.li+1);clearAll()}else{flash=.25;flashC=COL[u.k]}}}
function near(b){let t=null,d=1e9;for(const e of E){if(e.dead||e.y>b.y)continue;const q=Math.hypot(e.x-b.x,e.y-b.y);if(q<d){d=q;t=e}}if(boss&&boss.y<b.y){const q=Math.hypot(boss.x-b.x,boss.y-b.y);if(q<d)t=boss}return t}
function shotA(x,y,k,spd,a){X.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,k,r:k=='laser'?5:6,rf:0})}
const aimA=(x,y)=>Math.atan2(P.y-y,P.x-x);

/* ===== SPAWNING ===== */
function spawn(d,cnt){const s=stg(),n=cnt||2+Math.min(1,d|0),vy=65+28*d,x=50+Math.random()*(W-100),ph=Math.random()*6;
 if(s==0){for(let i=0;i<n;i++)E.push({k:'bee',x,x0:x,y:-20-i*38,hp:1,r:14,vy,ph,amp:35,t:2+Math.random()*3,pts:15})}
 else if(s==1){for(let i=0;i<n;i++){const o=(i-(n-1)/2);E.push({k:'ant',x:x+o*40,x0:x+o*40,y:-20-Math.abs(o)*28,hp:2,r:15,vy:vy*1.05,ph,amp:14,t:2.5+Math.random()*3,pts:18})}}
 else{for(let i=0;i<n;i++)E.push({k:'drone',x:Math.max(30,Math.min(W-30,x+(i-(n-1)/2)*70)),y:-20-i*30,hp:2,r:14,vy:vy*1.4,ty:80+Math.random()*130,dir:Math.random()<.5?-1:1,t:1.5+Math.random()*1.5,hv:0,pts:22})}
}
const OBD=[[['ob1a',46,22],['ob1b',44,44]],[['ob2a',24,42],['ob2b',46,34]],[['ob3a',72,13],['ob3b',16,60]]];
function spawnOb(d){const s=stg(),n=d>1.6&&Math.random()<.5?2:1,xs=[];
 for(let i=0;i<n;i++){const D=OBD[s][Math.random()*2|0];let x,t=0;do{x=D[1]+10+Math.random()*(W-2*D[1]-20);t++}while(t<14&&xs.some(q=>Math.abs(q[0]-x)<q[1]+D[1]+125));
  if(t>=14&&i)break;xs.push([x,D[1]]);O.push({im:D[0],x,y:-80-i*80,hw:D[1],hh:D[2],vy:80+14*d})}}
function mkBoss(){const s=stg(),L=lp(),mx=[160,280,450][s]*(1+.35*L);
 boss={k:'boss'+(s+1),x:W/2,y:-110,hw:[58,60,68][s],hh:[40,46,46][s],hp:mx,mx,t:0,ph:0,ft:2.5,fl:0,sm:3,vol:0};mT=5}
function bossDie(){const b=boss;boom(b.x,b.y,'#fff',60);boom(b.x,b.y,Y,40);boom(b.x,b.y,R,30);score+=500;bgPrev=stg();bgFade=1;bd++;boss=null;stT=0;prevT=score;glDone=0;warnT=0;
 for(const e of E){boom(e.x,e.y,MC[e.k],6);e.dead=1}X=[];O=[];for(let i=0;i<3;i++)drop(W/2+(i-1)*70,-20-i*25);flash=.6;flashC='255,255,255';bannerT=3.5}
function updBoss(dt){const b=boss,s=stg(),L=lp();b.t+=dt;if(b.fl>0)b.fl-=dt;
 if(b.y<110){b.y+=80*dt;return}
 const ph2=b.hp<b.mx*.5;b.ph+=dt*[.9,.65,1.1][s]*(ph2?1.25:1);b.x=W/2+Math.sin(b.ph)*(W/2-b.hw-10);b.y=110+Math.sin(b.t*1.4)*12;
 b.ft-=dt;if(b.ft>0)return;b.ft=[ph2?1.5:2.1,ph2?1.5:2,ph2?1.4:1.8][s]/(1+.1*L);b.vol++;
 if(s==0){const a=aimA(b.x,b.y),n=ph2?5:3;for(let i=0;i<n;i++)shotA(b.x,b.y+30,'sting',165+15*L,a+(i-(n-1)/2)*.32)}
 else if(s==1){const a=aimA(b.x,b.y),n=ph2?3:1;for(let i=0;i<n;i++)shotA(b.x,b.y+30,'spit',175+15*L,a+(i-(n-1)/2)*.3);
  if(--b.sm<=0){b.sm=3;for(const dx of[-50,50])E.push({k:'ant',x:b.x+dx,x0:b.x+dx,y:b.y+40,hp:2,r:15,vy:90,ph:Math.random()*6,amp:14,t:3,pts:18})}}
 else{for(const dx of[-45,0,45])shotA(b.x+dx,b.y+30,'laser',225+15*L,Math.PI/2);shotA(b.x,b.y+30,'laser',200,aimA(b.x,b.y));
  if(ph2&&b.vol%2==0)for(let i=0;i<8;i++)shotA(b.x,b.y,'spit',140,i*Math.PI/4+b.t)}}

/* ===== UPDATE ===== */
function upd(dt){tm+=dt;stT+=dt;const d=dif(),v=320*dt;
 if(keys.arrowleft||keys.a)tx-=v;if(keys.arrowright||keys.d)tx+=v;if(keys.arrowup||keys.w)ty-=v;if(keys.arrowdown||keys.s)ty+=v;
 tx=Math.max(18,Math.min(W-18,tx));ty=Math.max(110,Math.min(H-30,ty));
 const k=Math.min(1,dt*14),px=P.x;P.x+=(tx-P.x)*k;P.y+=(ty-P.y)*k;P.tilt+=(Math.max(-.3,Math.min(.3,(P.x-px)*.06))-P.tilt)*Math.min(1,dt*10);
 P.inv-=dt;P.cd-=dt;for(const q in P.t)if(P.t[q]>0)P.t[q]-=dt;if(flash>0)flash-=dt;if(bannerT>0)bannerT-=dt;if(bgFade>0)bgFade-=dt/1.6;
 /* weapons: every projectile ignores obstacles */
 const w=P.wp,n=P.cols,gap=w=='disc'?20:12;P.bx=[];for(let i=0;i<n;i++)P.bx.push(P.x+(i-(n-1)/2)*gap);
 P.beam=w=='heat'?1:0;
 if(w=='heat'){for(const bx of P.bx){
   for(const e of E)if(!e.dead&&e.y<P.y-10&&Math.abs(e.x-bx)<e.r+3){e.hp-=10*dt;if(e.hp<=0)kill(e)}
   if(boss&&boss.y>0&&Math.abs(bx-boss.x)<boss.hw*.9)bhit(10*dt)}}
 else if(P.cd<=0){
  if(w=='drill'){P.cd=.2;B.push({x:P.x,y:P.y-20,vx:0,vy:-620,dmg:1,r:4,k:'b'})}
  else if(w=='nail'){P.cd=.13;P.bx.forEach((q,i)=>B.push({x:q,y:P.y-20,vx:(q-P.x)*1.2,vy:-780,dmg:1,r:3,k:'n'}))}
  else{P.cd=.55;P.bx.forEach(q=>B.push({x:q,y:P.y-20,vx:(q-P.x)*2,vy:-470,dmg:4,r:12,k:'d',h:new Map(),a:0,rt:0,life:4}))}}
 /* progression */
 if(!boss){
  if(warnT>0){warnT-=dt;if(warnT<=0)mkBoss()}
  else if(score>=bAt(bd))warnT=2.6;
  else{
   spT-=dt;if(spT<=0){spawn(d);spT=Math.max(.85,1.5/(.6+d*.8))*(.75+Math.random()*.5)}
   obT-=dt;if(obT<=0){spawnOb(d);obT=Math.max(2.2,7/(.6+d))*(.8+Math.random()*.4)}
   if(!toolDone&&tm>5){toolDone=true;U.push({k:'nail',x:60+Math.random()*(W-120),y:-20})}
   const span=bAt(bd)-prevT;
   if(glDone<1&&score>=prevT+span*.4){glDone=1;U.push({k:'glove',g:1,x:60+Math.random()*(W-120),y:-20})}
   else if(glDone==1&&score>=prevT+span*.75){glDone=2;U.push({k:'glove',g:1,x:60+Math.random()*(W-120),y:-20})}}
 }else{updBoss(dt);if(boss&&boss.y>=100){mT-=dt;if(mT<=0){mT=5.5;spawn(d,1)}}
  if(boss&&bossHit(P.x,P.y,10))hurt()}
 /* mobs */
 for(const e of E){
  if(e.k=='bee'){e.y+=e.vy*dt;e.ph+=dt*3.5;e.x=e.x0+Math.sin(e.ph)*e.amp;e.t-=dt;
   if(e.t<0&&e.y>10&&e.y<H*.6){e.t=(3+Math.random()*2.5)/(.7+d*.3);shotA(e.x,e.y+10,'sting',150+25*d,aimA(e.x,e.y))}}
  else if(e.k=='ant'){e.y+=e.vy*dt;e.ph+=dt*2.2;e.x=e.x0+Math.sin(e.ph)*e.amp;e.t-=dt;
   if(e.t<0&&e.y>10&&e.y<H*.55){e.t=(3.4+Math.random()*2.5)/(.7+d*.3);shotA(e.x,e.y+10,'spit',140+20*d,aimA(e.x,e.y))}}
  else{ /* drone: dives in, hovers & strafes, fires straight down, then leaves */
   if(e.y<e.ty&&!e.hv0){e.y+=e.vy*dt}else{e.hv0=1;e.hv+=dt;e.x+=e.dir*(55+15*d)*dt;if(e.x<26||e.x>W-26)e.dir=-e.dir;
    e.t-=dt;if(e.t<0&&e.hv<6){e.t=(2.2+Math.random())/(.7+d*.3);shotA(e.x,e.y+10,'laser',230,Math.PI/2)}if(e.hv>6)e.y+=150*dt}}
  if(e.y>H+60)e.dead=1;
  if(!e.dead&&ht(e,P.x,P.y,10)){if(P.t.eye>0||P.t.glove>0)kill(e,false);else if(P.inv<=0){hurt();kill(e,false)}}}
 for(const o of O){o.y+=o.vy*dt;if(o.y>H+120)o.dead=1;else if(P.inv<=0&&P.t.eye<=0&&P.t.glove<=0&&obHit(o,P.x,P.y,9))hurt()}
 /* player projectiles */
 for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.a=(b.a||0)+dt*14;if(b.y<-30||b.y>H+30)b.dead=1;
  if(b.k=='d'){b.life-=dt;if(b.life<0)b.dead=1;
   if(b.x<10||b.x>W-10){b.vx=-b.vx;b.x=Math.max(10,Math.min(W-10,b.x))}
   if(!b.rt)for(const o of O)if(obHit(o,b.x,b.y,b.r)){b.rt=1;const t=near(b);if(t){const a=Math.atan2(t.y-b.y,t.x-b.x);b.vx=Math.cos(a)*500;b.vy=Math.sin(a)*500}else b.vx=(Math.random()-.5)*300;boom(b.x,b.y,'#fff',5);break}}
  for(const e of E){if(e.dead||b.dead||!ht(e,b.x,b.y,b.r))continue;
   if(b.k=='d'){if(tm-(b.h.get(e)||-9)<.5)continue;b.h.set(e,tm)}else b.dead=1;
   e.hp-=b.dmg;if(e.hp<=0)kill(e)}
  if(boss&&!b.dead&&bossHit(b.x,b.y,b.r)){if(b.k=='d'){if(tm-(b.h.get(boss)||-9)>=.5){b.h.set(boss,tm);bhit(b.dmg)}}else{b.dead=1;bhit(b.dmg)}}}
 /* enemy projectiles (helmet reflects them) */
 for(const s of X){s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.y>H+20||s.y<-30||s.x<-30||s.x>W+30){s.dead=1;continue}
  if(s.rf){for(const e of E)if(!e.dead&&!s.dead&&ht(e,s.x,s.y,s.r)){s.dead=1;e.hp-=3;if(e.hp<=0)kill(e)}
   if(!s.dead&&bossHit(s.x,s.y,s.r)){s.dead=1;bhit(3)}continue}
  const dd=Math.hypot(s.x-P.x,s.y-P.y);
