 {n:'BINONDO',span:9000,bg:'bg4',tiles:['bg4','bg4b'],fb:2,mob:'binondo',deco:1,obs:[['ob4a',36,34,[72,288]],['ob4b',30,36,[72,288]],['ob4c',34,34,[72,288]],['ob4d',21,44,[104,256]]],
  boss:{img:'boss4',name:'DRAGON OF BAD LUCK',emoji:'🐉',hp:1800,hw:64,hh:64,ai:'dragon',shot:'badorb',rate:1.25,spd:.8}}];

const bAt=n=>{let t=0;for(let i=0;i<Math.min(n+1,NST());i++)t+=STAGES[i].span;return n<NST()?t:t+LOOP_SPAN*(n-NST()+1)};   // 4500, 12000, 20000, then +9000 each

 else{
