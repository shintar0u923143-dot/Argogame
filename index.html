let st='title',sex='m',hi=0,P,B=[],E=[],X=[],U=[],F=[],O=[],score=0,tm=0,spT=1,obT=6,mT=4,ov=0,pause=false,tx=W/2,ty=H-150,tch=false,keys={};
let bd=0,boss=null,warnT=0,stT=0,prevT=0,glDone=0,bannerT=0,flash=0,flashC='60,255,106',toolDone=false,bgS=0,bgPrev=0,bgFade=0,boostDone=false,bombFx=0,shake=0,toastM='',toastT=0;
try{hi=+localStorage.getItem('ap_hi')||0}catch(e){}
/* ===== CAMPAIGN CONFIG: the scoreboard link now lives in config.js (so updating this file never erases it) ===== */

const IM={};

const ok=k=>IM[k]&&IM[k].complete&&IM[k].naturalWidth;

function go(){const v=nmEl.value.trim().replace(/[<>&"']/g,'').slice(0,12);
 if(v.length<2){nmMsg='Enter your name (at least 2 letters)';nmT=2.5;nmEl.focus();return}
 pname=v;try{localStorage.setItem('ap_name',v)}catch(e){}nmEl.blur();init()}
const lbGet=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
function localAdd(){const a=lbGet('ap_local');a.push({n:pname,s:score});a.sort((x,y)=>y.s-x.s);try{localStorage.setItem('ap_local',JSON.stringify(a.slice(0,10)))}catch(e){}}
function submit(){subMsg='';if(!API_URL){localAdd();subMsg='Saved on this device';return}
 subMsg='Submitting…';const body=JSON.stringify({name:pname,did,score,secs:Math.round(tm)});
 const send=n=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(r=>r.json()).then(j=>{subMsg=j.ok?'Submitted! Your rank: #'+j.rank:(j.err||'Could not submit')}).catch(()=>{if(n<2){subMsg='Retrying…';setTimeout(()=>send(n+1),3000)}else subMsg='Offline: score not sent'});send(0)}
function showLb(){st='lb';if(!API_URL){lbRows=lbGet('ap_local');lbMsg='Preview board (scoreboard not connected)';return}
 lbRows=lbGet('ap_lb');lbMsg='Loading…';
 fetch(API_URL+'?action=top&t='+Date.now()).then(r=>r.json()).then(j=>{if(j.ok){lbRows=j.rows;lbMsg='';try{localStorage.setItem('ap_lb',JSON.stringify(j.rows))}catch(e){}}else lbMsg='Try again later'}).catch(()=>{lbMsg='Offline: showing last saved board'})}

/* ===== GAME DATA ===== */
const TOOLS={heat:['HEAT GUN','🔥'],nail:['NAIL GUN','📌'],disc:['GRINDER','⚙️']},PPE={glove:'🧤',helm:'⛑️',eye:'🥽'};
const COL={eye:'58,168,255',glove:'60,255,106',helm:'255,210,31'},DUR={eye:5,glove:7,helm:7},CAP={eye:15,glove:21,helm:21};
const STG=[{n:'WESTERN FOREST'},{n:'THE DRYLANDS'},{n:'CONSTRUCTION SITE'}],BNAME=['MECHANICAL BEE','MECHA ANT QUEEN','BATTLE DRONE'];
const bAt=n=>n<3?[4500,12000,20000][n]:20000+9000*(n-2);   // boss score thresholds: 4500, 12000, 20000, then +9000 each
const stg=()=>bd%3,lp=()=>(bd/3)|0;
const dif=()=>Math.min(3.2,.8+.45*bd+Math.min(.7,stT/180*.7));   // ramps up during each stage and jumps after every boss
const BX=W-36,BY=H-92;   // bomb button
const mkP=()=>({x:W/2,y:H-130,wp:'drill',cols:1,t:{eye:0,glove:0,helm:0},last:'',inv:0,li:3,cd:0,tilt:0,bx:[],beam:0,boost:0,bLeft:0,bAcc:0,bombs:0,strk:0,pc:0});
function init(){P=mkP();P.inv=1.5;B=[];E=[];X=[];U=[];F=[];O=[];score=0;tm=0;spT=1.2;obT=7;mT=4;bd=0;boss=null;warnT=0;stT=0;prevT=0;glDone=0;toolDone=false;boostDone=false;bombFx=0;shake=0;toastT=0;FX=[];T=[];BV=60;punch=0;bannerT=3.2;flash=0;bgPrev=0;bgFade=0;tx=W/2;ty=H-150;pause=false;st='play'}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc]}
cv.addEventListener('pointerdown',e=>{const[x,y]=pt(e);tch=true;
 if(howInst){howInst=false;return}
 if(pause){pause=false;return}
 if(st=='title'){if(y>270&&y<370)sex=x<W/2?'m':'f';else if(y>=420&&y<=470&&x>90&&x<270)go();else if(y>=482&&y<=520&&x>90&&x<270)showLb();else if(y>=528&&y<=562&&x>90&&x<270&&!inst())install()}
 else if(st=='lb'){st='title'}
 else if(st=='over'){if(ov>1)showLb()}
 else{if(P.bombs>0&&Math.hypot(x-BX,y-BY)<32){useBomb();tch=false;return}tx=x;ty=y-60}});
cv.addEventListener('pointermove',e=>{if(tch&&st=='play'){const[x,y]=pt(e);tx=x;ty=y-60}});
addEventListener('pointerup',()=>tch=false);

 if(st=='title'&&(k=='enter'||k==' '))go();else if(st=='lb')st='title';else if(st=='over'&&k=='enter'&&ov>1)showLb();if(k=='p')pause=!pause;if(st=='play'&&(k=='b'||k==' '))useBomb()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pause=true});

/* ===== HELPERS ===== */
const ht=(e,x,y,r)=>Math.hypot(x-e.x,y-e.y)<e.r+r;
const bossHit=(x,y,r)=>{if(!boss||boss.y<-10)return false;const dx=(x-boss.x)/(boss.hw+r),dy=(y-boss.y)/(boss.hh+r);return dx*dx+dy*dy<1};
const obHit=(o,x,y,r)=>Math.abs(x-o.x)<o.hw*(o.im=='ob3a'?.8:.85)+r&&Math.abs(y-o.y)<o.hh*(o.im=='ob3a'?.55:.8)+r;
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,c})}}
function drop(x,y){let k;if(P.wp!='drill'&&Math.random()<.25)k=P.wp;else{const r=Math.random();k=r<.15?'heat':r<.3?'nail':r<.45?'disc':r<.75?'eye':'helm'}U.push({k,x,y})}
const MC={bee:Y,ant:'#b5532a',drone:'#7fd0ff'};
function kill(e,gain=true,nd){if(e.dead)return;if(gain)score+=e.pts;exFx(e.x,e.y,26);boom(e.x,e.y,MC[e.k],9);e.dead=1;if(gain&&!nd&&Math.random()<.075)drop(e.x,e.y)}
function bhit(d){if(!boss)return;boss.hp-=d;boss.fl=.08;if(boss.hp<=0)bossDie()}
function hurt(){if(P.inv>0||P.t.eye>0||P.t.glove>0||P.boost>0)return;
 P.li--;P.cols=Math.max(1,P.cols-1);boom(P.x,P.y,R,24);P.inv=2.2;
 if(P.li<=0){st='over';ov=0;submit();if(score>hi){hi=score;try{localStorage.setItem('ap_hi',hi)}catch(e){}}}}
function clearAll(){for(const e of E){boom(e.x,e.y,MC[e.k],7);e.dead=1}for(const o of O)boom(o.x,o.y,'#c9a36b',12);O=[];X=[];if(boss)bhit(boss.mx*.08);flash=.5;flashC=COL.glove}
function toast(m){toastM=m;toastT=2.6}
function pick(u){score+=50;
 if(u.k=='logo'){P.boost=6;P.bLeft=1000;P.bAcc=0;flash=.6;flashC='255,230,150';punch=.3;shake=.4;burst(u.x,u.y,'fire',30);burst(P.x,P.y,'helm',20);toast('ARGOPOWER BOOST!');return}
 if(TOOLS[u.k]){if(P.wp==u.k)P.cols=Math.min(5,P.cols+1);else{P.wp=u.k;P.cols=1}burst(u.x,u.y,'red',18);ftxt(P.cols>=5?TOOLS[u.k][0]+' MAX POWER!':TOOLS[u.k][0]+' x'+P.cols,u.x,u.y-20,'#fff')}
 else{P.last=u.k;P.t[u.k]=Math.min(CAP[u.k],P.t[u.k]+DUR[u.k]);burst(P.x,P.y,u.k,22);
  if(u.k=='glove'){P.li=Math.min(6,P.li+1);clearAll();ftxt('MAGNET SHIELD 7s  +1 ♥',P.x,P.y-50,'#7dff9a')}
  else{flash=.25;flashC=COL[u.k];ftxt(u.k=='eye'?'GOGGLE SHIELD +5s':'HELMET REFLECT +7s',P.x,P.y-50,`rgb(${COL[u.k]})`)}}
 if(++P.pc>=5){P.pc=0;if(P.bombs<5){P.bombs++;burst(BX,BY,'helm',16);ftxt('💣 BOMB +1',BX-40,BY-40,Y)}}}
function useBomb(){if(P.bombs<=0||st!='play'||pause)return;P.bombs--;bombFx=1.6;shake=.6;punch=.25;for(const e of E){exFx(e.x,e.y,34);kill(e,true,1)}for(let i=0;i<8;i++)exFx(40+Math.random()*(W-80),120+Math.random()*(H-240),40+Math.random()*30);burst(P.x,P.y,'fire',40);for(const o of O)boom(o.x,o.y,'#c9a36b',12);O=[];X=[];if(boss)bhit(boss.mx*.1);flash=.7;flashC='245,184,0'}
function near(b){let t=null,d=1e9;for(const e of E){if(e.dead||e.y>b.y)continue;const q=Math.hypot(e.x-b.x,e.y-b.y);if(q<d){d=q;t=e}}if(boss&&boss.y<b.y){const q=Math.hypot(boss.x-b.x,boss.y-b.y);if(q<d)t=boss}return t}
function shotA(x,y,k,spd,a,ex){X.push(Object.assign({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,k,r:k=='laser'?5:k=='missile'?7:6,rf:0,ay:0,hm:0},ex))}
const aimA=(x,y)=>Math.atan2(P.y-y,P.x-x);

/* ===== SPAWNING ===== */
function spawn(d,cnt){const s=stg(),n=cnt||2+Math.min(2,(d*.7)|0),vy=70+26*d,hm=1+lp(),x=50+Math.random()*(W-100),ph=Math.random()*6;
 if(s==0){for(let i=0;i<n;i++)E.push({k:'bee',x,x0:x,y:-20-i*38,hp:hm,r:14,vy,ph,amp:35,t:2+Math.random()*3,pts:15})}
 else if(s==1){for(let i=0;i<n;i++){const o=(i-(n-1)/2);E.push({k:'ant',x:x+o*40,x0:x+o*40,y:-20-Math.abs(o)*28,hp:2*hm,r:15,vy:vy*1.05,ph,amp:14,t:2.5+Math.random()*3,pts:20})}}
 else{for(let i=0;i<n;i++)E.push({k:'drone',x:Math.max(30,Math.min(W-30,x+(i-(n-1)/2)*70)),y:-20-i*30,hp:2*hm,r:14,vy:vy*1.4,ty:80+Math.random()*130,dir:Math.random()<.5?-1:1,t:1.5+Math.random()*1.5,hv:0,pts:25})}
}
const OBD=[[['ob1a',44,38],['ob1b',42,44]],[['ob2a',24,40],['ob2b',40,40]],[['ob3a',76,37],['ob3b',19,60]]];
function spawnOb(d){const s=stg(),n=d>1.6&&Math.random()<.5?2:1,xs=[];
 for(let i=0;i<n;i++){const D=OBD[s][Math.random()*2|0];let x,t=0;do{x=D[1]+10+Math.random()*(W-2*D[1]-20);t++}while(t<14&&xs.some(q=>Math.abs(q[0]-x)<q[1]+D[1]+125));
  if(t>=14&&i)break;xs.push([x,D[1]]);O.push({im:D[0],x,y:-80-i*80,hw:D[1],hh:D[2],vy:80+14*d})}}
function mkBoss(){const s=stg(),L=lp(),mx=[800,1300,2200][s]*(1+.6*L);
 boss={k:'boss'+(s+1),x:W/2,y:-110,hw:[64,66,70][s],hh:[54,56,60][s],hp:mx,mx,t:0,ph:0,ft:2.2,fl:0,vol:0,lph:1,str:0,sT:0};mT=5}
function bossDie(){const b=boss;for(let i=0;i<10;i++)exFx(b.x+(Math.random()-.5)*b.hw*2,b.y+(Math.random()-.5)*b.hh*2,40+Math.random()*40);burst(b.x,b.y,'fire',50);shake=.7;boom(b.x,b.y,'#fff',60);boom(b.x,b.y,Y,40);boom(b.x,b.y,R,30);score+=500+250*bd;bgPrev=stg();bgFade=1;bd++;boss=null;stT=0;prevT=score;glDone=0;warnT=0;boostDone=false;
 for(const e of E){boom(e.x,e.y,MC[e.k],6);e.dead=1}X=[];O=[];U.push({k:['heat','nail','disc'][Math.random()*3|0],x:W/2-50,y:-20},{k:Math.random()<.5?'eye':'helm',x:W/2+50,y:-50});flash=.6;flashC='255,255,255';bannerT=3.5}
/* Boss attacks: each boss has more patterns than the last; every boss gets faster and denser as its HP drops (3 phases) and on every loop */
function updBoss(dt){const b=boss,s=stg(),L=lp();b.t+=dt;if(b.fl>0)b.fl-=dt;
 if(b.y<128){b.y+=80*dt;return}
 const ph=b.hp<b.mx*.3?3:b.hp<b.mx*.65?2:1,spd=1+.12*L+(ph-1)*.07;
 if(ph!=b.lph){b.lph=ph;toast(ph==2?'BOSS IS ANGRY!':'BOSS ENRAGED!');flash=.3;flashC='225,37,27'}
 b.ph+=dt*[.9,.7,1.1][s]*(1+.15*(ph-1));b.x=W/2+Math.sin(b.ph)*(W/2-b.hw-10);b.y=128+Math.sin(b.t*1.4)*12;
 if(b.str>0){b.str-=dt;b.sT-=dt;if(b.sT<=0){b.sT=b.sInt;for(let i=0;i<b.arms;i++)shotA(b.x,b.y+10,b.sk,b.sSp,b.sa+i*2*Math.PI/b.arms);b.sa+=b.sRot}}
 b.ft-=dt;if(b.ft>0||b.str>0)return;
 const v=b.vol++,K=['sting','spit','laser'][s];b.ft=([1.45,1.3,1.2][s]-(ph-1)*.2)/(1+.1*L);
 const fan=(n,sp,sp2,k=K)=>{const a=aimA(b.x,b.y);for(let i=0;i<n;i++)shotA(b.x,b.y+30,k,sp*spd,a+(i-(n-1)/2)*sp2)};
 const ring=(n,sp,k=K)=>{const o=b.t*1.7;for(let i=0;i<n;i++)shotA(b.x,b.y,k,sp*spd,o+i*2*Math.PI/n)};
 const stream=(arms,dur,int,rot,sp,k=K)=>Object.assign(b,{str:dur,sT:0,sInt:int,arms,sRot:rot*(v%2?1:-1),sSp:sp*spd,sk:k,sa:b.t});
 if(s==0){ /* MECHANICAL BEE: aimed fans, rings, then a twin spiral */
  const p=v%(ph==1?2:3);
  if(p==0)fan(ph==1?5:7,190,.24);else if(p==1)ring(ph==1?12:16,150);else stream(2,1.6,.09,.33,170);
  if(ph==3&&v%2==0)fan(3,250,.1);
  if(v%4==3)for(const dx of[-60,60])E.push({k:'bee',x:b.x+dx,x0:b.x+dx,y:b.y+30,hp:1+L,r:14,vy:110,ph:Math.random()*6,amp:35,t:1,pts:15})}
 else if(s==1){ /* MECHA ANT QUEEN: fans, lobbed acid rain, ant swarms, triple spiral */
  const p=v%(ph==1?3:4);
  if(p==0)fan(ph==1?5:7,185,.22);
  else if(p==1){const n=ph==1?7:10;for(let i=0;i<n;i++)shotA(b.x,b.y+20,'spit',(190+Math.random()*90)*spd,-Math.PI/2+(i-(n-1)/2)*.2,{ay:250})}
  else if(p==2){for(const dx of[-55,0,55])E.push({k:'ant',x:b.x+dx,x0:b.x+dx,y:b.y+40,hp:2*(1+L),r:15,vy:95,ph:Math.random()*6,amp:14,t:2,pts:20});fan(3,210,.3)}
  else stream(3,2,.1,.3,165);
  if(ph==3&&v%2)ring(10,135)}
 else{ /* BATTLE DRONE: laser curtains with one gap, burst fans, homing missiles, rings, 4-arm spiral */
  const p=v%(ph==1?3:4);
  if(p==0){const gap=1+Math.random()*6|0;for(let i=0;i<9;i++)if(i!=gap&&i!=gap+1)shotA(20+i*40,b.y+20,'laser',200*spd,Math.PI/2)}
  else if(p==1)fan(ph==1?3:5,260,.12);
  else if(p==2)ring(ph==1?14:20,150);
  else stream(4,2.2,.08,.27,175);
  if(ph>=2&&v%2==0)for(const dx of[-50,50])shotA(b.x+dx,b.y+20,'missile',150*spd,Math.PI/2+dx/200,{hm:1.8});
  if(ph==3&&v%3==1)fan(5,230,.18);
  if(v%5==4)spawn(dif(),2)}}

/* ===== UPDATE ===== */
function upd(dt){tm+=dt;stT+=dt;const d=dif(),v=320*dt;
 if(keys.arrowleft||keys.a)tx-=v;if(keys.arrowright||keys.d)tx+=v;if(keys.arrowup||keys.w)ty-=v;if(keys.arrowdown||keys.s)ty+=v;
 tx=Math.max(18,Math.min(W-18,tx));ty=Math.max(110,Math.min(H-30,ty));
 const k=Math.min(1,dt*14),px=P.x;P.x+=(tx-P.x)*k;P.y+=(ty-P.y)*k;P.tilt+=(Math.max(-.3,Math.min(.3,(P.x-px)*.06))-P.tilt)*Math.min(1,dt*10);
 P.inv-=dt;P.cd-=dt;for(const q in P.t)if(P.t[q]>0)P.t[q]-=dt;if(flash>0)flash-=dt;if(bannerT>0)bannerT-=dt;if(bgFade>0)bgFade-=dt/1.6;if(bombFx>0)bombFx-=dt;if(shake>0)shake-=dt;if(toastT>0)toastT-=dt;
 if(P.boost>0){P.boost-=dt;const a=Math.min(P.bLeft,1000*dt/6);P.bLeft-=a;P.bAcc+=a;const w=P.bAcc|0;score+=w;P.bAcc-=w;
  if(P.boost<=0){score+=Math.round(P.bLeft+P.bAcc);P.bLeft=0;P.bAcc=0;P.inv=1.2;flash=.4;flashC='255,255,255';toast('BOOST COMPLETE! +1000')}}
 BV+=((P.boost>0?620:60)-BV)*Math.min(1,dt*(P.boost>0?3:1.6));updFx(dt);
 const wd=dt*(P.boost>0?1.75:1);   /* the whole world runs faster during the ArgoPower boost */
 /* weapons: every projectile ignores obstacles */
 const w=P.wp,n=P.cols,gap=w=='disc'?20:12,mz=ok(sex)?10:0;P.bx=[];for(let i=0;i<n;i++)P.bx.push(P.x+mz+(i-(n-1)/2)*gap);
 P.beam=w=='heat'?1:0;
